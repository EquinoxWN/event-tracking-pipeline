name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: make setup lint test
      - name: End-to-end (JS tracker to collector on 127.0.0.1)
        run: |
          if python scripts/e2e.py --events 200 | tee "$RUNNER_TEMP/e2e.txt"; then
            echo "::notice title=Tracker to collector e2e::$(grep -E '^(tracker|collector):' "$RUNNER_TEMP/e2e.txt" | paste -sd ' ' -)"
          else
            echo "::error title=Tracker to collector e2e::$(tail -n 3 "$RUNNER_TEMP/e2e.txt" | paste -sd ' ' -)"
            exit 1
          fi
      - name: Known-vulnerability audit
        run: make audit
